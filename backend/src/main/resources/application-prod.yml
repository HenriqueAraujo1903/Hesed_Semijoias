spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/${DB_NAME:hesed_db}
    username: ${DB_USERNAME:hesed}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

server:
  port: 8080

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}

  upload:
    dir: ${UPLOAD_DIR:/app/uploads}
    base-url: ${UPLOAD_BASE_URL:http://localhost:8080/uploads}

  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

  # Em produção o site é HTTPS — Secure=true é obrigatório.
  cookie:
    secure: ${COOKIE_SECURE:true}

logging:
  level:
    root: INFO
    com.hesed: INFO
    org.springframework.security: WARN
