spring:
  application:
    name: hesed-api

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:hesed_db}
    username: ${DB_USERNAME:henriquearaujo}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

server:
  port: 8080

# JWT Configuration
# O secret DEVE vir da variável de ambiente JWT_SECRET.
# O fallback abaixo é um valor de DESENVOLVIMENTO LOCAL, sem valor em produção.
# Em produção usa-se o perfil 'prod' (application-prod.yml), onde o secret é
# ${JWT_SECRET} SEM fallback — a aplicação falha ao subir se a env não existir,
# impedindo o uso acidental de um segredo conhecido.
app:
  jwt:
    secret: ${JWT_SECRET:dev-only-insecure-secret-change-me-in-every-real-environment-0000}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}  # 24 hours

  upload:
    dir: ${UPLOAD_DIR:./uploads}
    base-url: ${UPLOAD_BASE_URL:http://localhost:8080/uploads}

  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

  # Em dev local (HTTP) o cookie Secure=false permite o browser enviar o cookie.
  # Em produção/homolog (HTTPS) deve ser true — sobreposto via env/perfil.
  cookie:
    secure: ${COOKIE_SECURE:false}
