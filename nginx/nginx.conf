worker_processes auto;
events {
    worker_connections 1024;
}
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 10M;
    # Oculta versão do Nginx nos headers (Server: nginx)
    server_tokens off;
    # Logging
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;
    # Gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    # Rate limiting for login endpoint
    limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;
    # Upstream servers
    upstream backend {
        server backend:8080;
    }
    upstream frontend {
        server frontend:80;
    }
    # ---- HTTP: valida ACME (Certbot) e redireciona o resto para HTTPS ----
    server {
        listen 80;
        server_name hesedsemijoias.online www.hesedsemijoias.online;
        # Desafio do Let's Encrypt (renovação via webroot)
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }
        # Redireciona todo o resto para HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }
    # ---- HTTPS ----
    server {
        listen 443 ssl;
        http2 on;
        server_name hesedsemijoias.online www.hesedsemijoias.online;
        ssl_certificate /etc/letsencrypt/live/hesedsemijoias.online/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/hesedsemijoias.online/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        # ---- Security headers ----
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        #
        # Content-Security-Policy — política restritiva ajustada para os
        # recursos legítimos do sistema:
        #   - fonts.googleapis.com / fonts.gstatic.com : Google Fonts (catálogo)
        #   - placehold.co                             : imagens placeholder dos produtos
        #   - wa.me / web.whatsapp.com                 : links do botão WhatsApp
        #   - www.googletagmanager.com / www.google-analytics.com : analytics (VITE_GA_ID)
        #   - frame-ancestors 'none'                   : equivalente a X-Frame-Options DENY
        #
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://www.googletagmanager.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://placehold.co; connect-src 'self' https://www.google-analytics.com; frame-src 'none'; object-src 'none'; base-uri 'self'; frame-ancestors 'none';" always;
        # Rate limit on login
        location /api/auth/login {
            limit_req zone=login burst=3 nodelay;
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # Garante atributos de segurança nos cookies emitidos pelo backend
            proxy_cookie_flags jwt HttpOnly SameSite=Strict;
        }
        # API reverse proxy
        location /api/ {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 30s;
            proxy_read_timeout 60s;
            # Garante atributos de segurança nos cookies emitidos pelo backend
            proxy_cookie_flags jwt HttpOnly SameSite=Strict;
        }
        # Uploads (served by backend)
        location /uploads/ {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            expires 7d;
            add_header Cache-Control "public";
        }
        # Frontend (SPA)
        location / {
            proxy_pass http://frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
