services:
  # ============ PostgreSQL ============
  postgres:
    image: postgres:16-alpine
    container_name: hesed-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-hesed_db}
      POSTGRES_USER: ${DB_USERNAME:-hesed}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Porta acessível apenas internamente na rede Docker (não exposta à internet)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-hesed} -d ${DB_NAME:-hesed_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============ Backend (Spring Boot) ============
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hesed-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-hesed_db}
      DB_USERNAME: ${DB_USERNAME:-hesed}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost}
      UPLOAD_DIR: /app/uploads
      UPLOAD_BASE_URL: ${UPLOAD_BASE_URL:-http://localhost/uploads}
    volumes:
      - uploads_data:/app/uploads
    # Porta acessível apenas internamente na rede Docker (Nginx faz o proxy)
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/api/products/catalog"]
      interval: 30s
      timeout: 5s
      start_period: 40s
      retries: 3

  # ============ Frontend (React + Nginx) ============
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: hesed-frontend
    restart: unless-stopped
    depends_on:
      - backend

  # ============ Nginx (Reverse Proxy) ============
  nginx:
    image: nginx:alpine
    container_name: hesed-nginx
    restart: unless-stopped
    depends_on:
      - backend
      - frontend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - certbot_certs:/etc/letsencrypt:ro
      - certbot_webroot:/var/www/certbot:ro
    # SSL: a emissão inicial é feita pelo init-ssl.sh e a renovação pelo cron
    # da VPS (/root/renew-certs.sh, 2x/dia), que roda o certbot/certbot em um
    # container avulso nos volumes acima e recarrega este Nginx.
    # Redes: "default" = rede interna do Hesed (só containers do Hesed);
    # "edge" = rede de borda compartilhada com o ChurchStage. Só o Nginx entra
    # nela, então o ChurchStage não enxerga o banco nem os serviços do Hesed.
    networks:
      - default
      - edge

volumes:
  postgres_data:
  uploads_data:
  certbot_certs:
  certbot_webroot:

networks:
  # Rede de borda da VPS (Nginx do Hesed + backend/frontend do ChurchStage).
  # Externa: criada uma única vez na VPS com `docker network create vps_edge`.
  edge:
    name: vps_edge
    external: true
