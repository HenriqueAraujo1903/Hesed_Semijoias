services:
  # ============ PostgreSQL ============
  postgres:
    image: postgres:16-alpine
    container_name: hesed-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-hesed_db}
      POSTGRES_USER: ${DB_USERNAME:-hesed}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-hesed} -d ${DB_NAME:-hesed_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============ Backend (Spring Boot) ============
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hesed-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-hesed_db}
      DB_USERNAME: ${DB_USERNAME:-hesed}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost}
      UPLOAD_DIR: /app/uploads
      UPLOAD_BASE_URL: ${UPLOAD_BASE_URL:-http://localhost/uploads}
    volumes:
      - uploads_data:/app/uploads
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/api/products/catalog"]
      interval: 30s
      timeout: 5s
      start_period: 40s
      retries: 3

  # ============ Frontend (React + Nginx) ============
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: hesed-frontend
    restart: unless-stopped
    depends_on:
      - backend

  # ============ Nginx (Reverse Proxy) ============
  nginx:
    image: nginx:alpine
    container_name: hesed-nginx
    restart: unless-stopped
    depends_on:
      - backend
      - frontend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      # Uncomment for SSL:
      # - ./nginx/ssl:/etc/nginx/ssl:ro

volumes:
  postgres_data:
  uploads_data:
